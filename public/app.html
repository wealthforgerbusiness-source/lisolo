<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisolo</title>
<meta name="description" content="Messages anonymes et quiz.">
<meta name="theme-color" content="#F85A03">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lisolo">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<style>
:root{--o:#F85A03;--o2:#D84C00;--o3:#B53E00;--o4:#7A2A00;--tint:#FFF2EA;--tint2:#FFE3D2;--ink:#1B120D;--mut:#6F615A;--line:#EADFD7;--ease:cubic-bezier(.2,.75,.2,1);--navh:66px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--o);color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;line-height:1.45;overflow-x:hidden}
body.m-app{background-color:#F85A03;background-image:radial-gradient(680px 520px at 92% -6%,rgba(255,214,188,.32),rgba(255,214,188,0) 70%),radial-gradient(560px 520px at -8% 104%,rgba(80,26,0,.55),rgba(80,26,0,0) 72%),linear-gradient(168deg,#F85A03 0%,#E85300 45%,#C94500 78%,#A23800 100%);background-attachment:fixed}
body.m-pub{background:var(--o);background-image:radial-gradient(700px 520px at 88% -8%,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),linear-gradient(168deg,#FC6E15 0%,#F85A03 44%,#C94500 100%);background-attachment:fixed}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
a{color:inherit}
.ic{width:22px;height:22px;flex:none;display:block}
:focus-visible{outline:3px solid var(--o3);outline-offset:2px;border-radius:10px}
.muted{color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12) rotate(-3deg)}30%{transform:scale(.97)}45%{transform:scale(1)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.6);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sheen{0%{transform:skewX(-14deg) translateX(-170%)}55%,100%{transform:skewX(-14deg) translateX(520%)}}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-16px,-24px,0)}}
@keyframes navpop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-4px) scale(1.16)}100%{transform:translateY(-1px) scale(1.1)}}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.boot{position:fixed;inset:0;z-index:300;background:var(--o);display:grid;place-items:center;transition:opacity .4s,visibility .4s}
.boot.off{opacity:0;visibility:hidden;pointer-events:none}
.boot img{width:76px;height:auto;animation:beat 1.5s var(--ease) infinite}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 20px;border-radius:15px;font-weight:800;font-size:15.5px;text-decoration:none;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:19px;height:19px}
.btn.pri{background:var(--o);color:#fff;box-shadow:0 10px 22px rgba(248,90,3,.28)}
.btn.pri:hover:not(:disabled){background:var(--o2)}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--o);background:var(--tint)}
.btn.soft{background:var(--tint);color:var(--o3)}
.btn.soft:hover:not(:disabled){background:var(--tint2)}
.btn.dang{background:var(--o3);color:#fff}
.btn.wh{background:#fff;color:var(--o3);box-shadow:0 12px 26px rgba(0,0,0,.18)}
.btn.glass{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn.glass:hover{background:rgba(255,255,255,.28)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.ghost.loading::after,.btn.soft.loading::after{border-color:var(--tint2);border-top-color:var(--o)}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;transition:background .2s}
.iconbtn:hover{background:var(--tint)}
.iconbtn.spin .ic{animation:spin .6s linear}
.iconbtn.wt{color:#fff}
.iconbtn.wt:hover{background:rgba(255,255,255,.22)}
.logo-o{display:block;width:34px;height:32px;background:var(--o);-webkit-mask:url(/images/lisolo-symbole-blanc.png) center/contain no-repeat;mask:url(/images/lisolo-symbole-blanc.png) center/contain no-repeat}

.inp{width:100%;height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;background:#fff;font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s}
.inp:focus,.ta:focus{border-color:var(--o);box-shadow:0 0 0 4px rgba(248,90,3,.15)}
.ta{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.5;outline:0;background:#fff;transition:border-color .2s,box-shadow .2s}
.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.pre-w{position:relative}
.pre-w .pre{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--mut)}
.pre-w .inp{padding-left:34px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cnt{font-size:12.5px;font-weight:700;color:var(--mut);text-align:right;margin-top:6px}

.shell{min-height:100dvh}
.shell::before{content:"";position:fixed;right:-100px;top:16%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.20),rgba(255,255,255,0) 70%);pointer-events:none;z-index:0;animation:float 13s ease-in-out infinite}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(126,40,0,.62);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.22);box-shadow:0 -12px 30px rgba(70,20,0,.2);padding-bottom:var(--sb)}
.nav-brand{display:none}
.nav-list{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:var(--navh)}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:rgba(255,255,255,.78);font-size:11px;font-weight:700;transition:color .2s}
.ni .ic{width:25px;height:25px;transition:transform .3s var(--ease)}
.ni.on{color:#fff}
.ni.on .ic{transform:translateY(-1px) scale(1.1);animation:navpop .45s var(--ease)}
.ni.mid{color:#fff}
.ni.mid .ic{transition:transform .3s var(--ease)}
.ni.mid:hover .ic{transform:rotate(90deg)}
.pl{display:grid;place-items:center;width:50px;height:34px;border-radius:11px;background:#fff;box-shadow:0 6px 16px rgba(70,20,0,.28);transition:transform .2s var(--ease)}
.ni.mid .pl .ic{color:var(--o)}
.ni.mid:active .pl{transform:scale(.9)}
.ni.mid .pl .ic{width:22px;height:22px}
.ni.mid .tx{display:none}
.ind{position:absolute;top:0;left:0;width:30px;height:4px;border-radius:0 0 4px 4px;background:#fff;transform:translate(var(--ix,0px),var(--iy,0px));transition:transform .45s var(--ease),opacity .2s;opacity:0;pointer-events:none}
.ind.show{opacity:1}
.bd{position:absolute;top:7px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#fff;color:var(--o3);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid rgba(126,40,0,.45);animation:pop .45s var(--ease)}
.main{position:relative;z-index:1;padding-bottom:calc(var(--navh) + var(--sb) + 12px)}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--st) + 10px) 16px 10px;background:linear-gradient(180deg,rgba(126,40,0,.5),rgba(126,40,0,.2));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.18);min-height:64px;color:#fff}
.bar-t{font-size:22px;font-weight:800;letter-spacing:-.01em}
.bar .iconbtn{color:#fff}
.bar .iconbtn:hover{background:rgba(255,255,255,.18)}
.bar .btn.pri{background:#fff;color:var(--o3);box-shadow:0 8px 18px rgba(60,20,0,.22)}
.bar .btn.pri:hover{background:var(--tint)}
.view{max-width:720px;margin:0 auto;padding:18px 16px 28px;outline:0;animation:viewin .32s var(--ease)}
.view.enter>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.view.enter .hero .hello{animation:rise .5s .04s var(--ease) both}
.view.enter .hero h2{animation:rise .55s .1s var(--ease) both}
.view.enter .hero .linkbox{animation:rise .55s .16s var(--ease) both}
.view.enter .hero .hact{animation:rise .55s .22s var(--ease) both}
.view.enter .stats .stat:nth-child(1){animation:rise .5s .16s var(--ease) both}
.view.enter .stats .stat:nth-child(2){animation:rise .5s .21s var(--ease) both}
.view.enter .stats .stat:nth-child(3){animation:rise .5s .26s var(--ease) both}
.view.enter .tiles .tile:nth-child(1){animation:rise .5s .28s var(--ease) both}
.view.enter .tiles .tile:nth-child(2){animation:rise .5s .33s var(--ease) both}
.view.enter .tiles .tile:nth-child(3){animation:rise .5s .38s var(--ease) both}
@media(min-width:900px){
  .nav{top:0;bottom:auto;right:auto;width:248px;height:100dvh;border-top:0;border-right:1px solid rgba(255,255,255,.18);padding:26px 16px;display:flex;flex-direction:column;background:rgba(112,35,0,.55)}
  .nav-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;color:#fff;padding:0 12px 22px}
  .nav-list{display:flex;flex-direction:column;align-items:stretch;height:auto;gap:4px}
  .ni{flex-direction:row;justify-content:flex-start;gap:14px;height:52px;padding:0 14px;border-radius:14px;font-size:16px}
  .ni:hover{background:rgba(255,255,255,.14);color:#fff}
  .ni.mid{order:-1;margin-bottom:12px;background:#fff;color:var(--o3);justify-content:center;box-shadow:0 12px 26px rgba(70,20,0,.26)}
  .ni.mid:hover{background:var(--tint);color:var(--o3)}
  .ni.mid .pl{background:transparent;box-shadow:none;width:auto;height:auto}
  .ni.mid .pl .ic{color:var(--o)}
  .ni.mid .tx{display:inline}
  .ind{width:4px;height:30px;border-radius:0 4px 4px 0}
  .bd{position:static;margin-left:auto;border-color:transparent}
  .main{margin-left:248px;padding-bottom:40px}
  .bar{min-height:72px;padding-top:18px}
}
.logo-o{background:#fff}

.stack{display:grid;gap:14px}
.card{background:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:22px;padding:18px;color:var(--ink);box-shadow:0 18px 38px rgba(80,26,0,.18)}
.card.tint{background:var(--tint);border-color:var(--tint2)}
.h3{font-size:18px;font-weight:800}

.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(158deg,rgba(122,42,0,.4),rgba(122,42,0,.18) 58%,rgba(60,20,0,.24));border:1px solid rgba(255,255,255,.34);color:#fff;padding:24px 20px 20px;box-shadow:0 26px 52px rgba(80,26,0,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero::after{content:"";position:absolute;top:-60%;bottom:-60%;left:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-14deg) translateX(-170%);animation:sheen 6s 1.2s var(--ease) infinite;pointer-events:none}
.hero .rg{position:absolute;right:-40px;top:-40px;width:180px;height:180px;pointer-events:none}
.hero .rg i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ring 4.5s var(--ease) infinite;opacity:0}
.hero .rg i:nth-child(2){animation-delay:1.5s}
.hero .rg i:nth-child(3){animation-delay:3s}
.hello{position:relative;font-weight:700;opacity:.92}
.hero h2{position:relative;font-size:26px;font-weight:800;letter-spacing:-.01em;margin:2px 0 16px}
.linkbox{position:relative;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:6px 6px 6px 16px;margin-bottom:12px}
.lt{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hact{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hact .btn{height:46px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:20px;padding:14px 12px;text-align:left;transition:transform .2s,background .2s;color:var(--ink);box-shadow:0 14px 28px rgba(80,26,0,.16)}
button.stat:hover{background:var(--tint)}
button.stat:active{transform:scale(.97)}
.stat .n{font-size:30px;font-weight:800;line-height:1.1;color:var(--o)}
.stat .n small{font-size:14px;font-weight:700;color:var(--mut)}
.stat .l{font-size:12.5px;font-weight:700;color:var(--mut);margin-top:4px}
.meter{height:8px;border-radius:6px;background:var(--tint2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:var(--o);transition:width .9s var(--ease)}
.plan{display:flex;align-items:center;gap:14px}
.plan .pi{width:46px;height:46px;border-radius:15px;background:var(--o);color:#fff;display:grid;place-items:center;flex:none}
.plan .pt{flex:1;min-width:0}
.plan .pt b{display:block;font-size:16px}
.plan .pt span{font-size:14px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;padding:16px;background:#fff;font-weight:800;color:var(--ink);box-shadow:0 14px 28px rgba(80,26,0,.16);transition:border-color .2s,transform .2s,background .2s}
.tile:hover{border-color:var(--o);background:var(--tint)}
.tile:active{transform:scale(.98)}
.tile .ti{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--o);display:grid;place-items:center;flex:none}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(120deg,#fff 0%,#FFF7F2 60%,#FFE9DB 100%)}
.tile.wide .tw{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.wide small{font-weight:600;font-size:13px;color:var(--mut)}
.tile.wide .chv{width:18px;height:18px;color:var(--o)}

.note{display:flex;align-items:center;gap:10px;background:rgba(122,42,0,.3);border:1px solid rgba(255,255,255,.26);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.note .ic{width:20px;height:20px}
.note span{flex:1}
.note .lk{color:#fff}
.lk{font-weight:800;color:var(--o2);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.msg{position:relative;background:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;padding:16px;color:var(--ink);box-shadow:0 14px 30px rgba(80,26,0,.16);transition:opacity .25s,transform .25s,border-color .3s,background .3s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.msg.new{border-color:var(--o);background:var(--tint)}
.msg.out{opacity:0;transform:translateX(30px)}
.mh{display:flex;align-items:center;gap:12px}
.mav{width:40px;height:40px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;flex:none}
.mav .ic{width:19px;height:19px}
.mm{flex:1;min-width:0}
.mm b{display:block;font-size:14.5px}
.mm span{font-size:12.5px;color:var(--mut);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--o);flex:none}
.mt{margin:12px 0;font-size:17px;line-height:1.5;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.ma{display:flex;gap:8px;flex-wrap:wrap}
.ma .btn{height:38px;padding:0 12px;font-size:13.5px;border-radius:11px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 18px;color:#fff;background:rgba(122,42,0,.22);border:1px solid rgba(255,255,255,.2);border-radius:24px}
.empty .eb{width:92px;height:92px;border-radius:50%;background:rgba(122,42,0,.35);border:1px solid rgba(255,255,255,.32);color:#fff;display:grid;place-items:center;position:relative}
.empty .eb .ic{width:40px;height:40px}
.empty .eb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0;animation:ring 3s var(--ease) infinite}
.empty h3{font-size:19px;font-weight:800}
.empty p{color:rgba(255,255,255,.94);max-width:340px}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,rgba(255,255,255,.16) 25%,rgba(255,255,255,.32) 50%,rgba(255,255,255,.16) 75%);background-size:200% 100%;animation:shim 1.3s infinite}

.qrow{background:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;padding:16px;color:var(--ink);box-shadow:0 14px 30px rgba(80,26,0,.16);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms);transition:opacity .25s,transform .25s}
.qrow.out{opacity:0;transform:translateX(30px)}
.qrow h3{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.qrow .meta{font-size:13.5px;color:var(--mut);font-weight:600;margin:3px 0 12px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.qa .btn{height:38px;padding:0 12px;font-size:13.5px;border-radius:11px}

.avatar{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;font-weight:800;font-size:19px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:84px;height:84px;font-size:36px}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 16px;color:#fff;background:rgba(122,42,0,.28);border:1px solid rgba(255,255,255,.24);border-radius:24px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prof h2{font-size:22px;font-weight:800}
.prof .muted{color:rgba(255,255,255,.94)}
.prof .avatar{box-shadow:0 16px 34px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.3)}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(122,42,0,.42);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
.chip .ic{width:15px;height:15px}
.chip.pro{background:#fff;border-color:#fff;color:var(--o3)}
.rows{background:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:22px;overflow:hidden;color:var(--ink);box-shadow:0 16px 34px rgba(80,26,0,.18)}
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;text-align:left;font-weight:700;font-size:16px;text-decoration:none;transition:background .2s}
.rw+.rw{border-top:1px solid var(--line)}
.rw:hover{background:var(--tint)}
.rw .ic{color:var(--o)}
.rw span{flex:1}
.rw .chv{color:#B8AAA2;width:18px;height:18px}
.rw.danger,.rw.danger .ic{color:var(--o3)}

.toasts{position:fixed;left:0;right:0;bottom:calc(var(--navh) + var(--sb) + 14px);z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}

    lines.forEach(function (l, i) { g.fillText(l, 150, cardY + padY + head + i * lineH); });

          bigCheck(),
          h('h2', { text: 'Ton quiz est en ligne', style: 'font-size:24px;font-weight:800' }),
          h('p', { class: 'muted', text: 'Partage ce lien pour que tes amis y répondent.' }),
          h('div', { class: 'linkline' }, h('span', { class: 'lt', text: location.host + '/q/' + d.id }),
            h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Copier le lien', on: { click: function () { copyLink(url); } } }, ic('copy'))),
          (function () {
            var nm = h('span', { text: 'Nom affiché : ' + myName() });
            var b = h('button', { class: 'btn ghost block', type: 'button' }, ic('edit'), nm);
            b.addEventListener('click', function () { editNameSheet(function () { nm.textContent = 'Nom affiché : ' + myName(); }); });
            return b;
          })(),
          h('button', { class: 'btn pri block', type: 'button', on: { click: function () { shareLink(url, 'Réponds au quiz de ' + myName() + ' sur Lisolo'); } } }, ic('share'), 'Partager'),
          h('button', { class: 'btn soft block', type: 'button', on: { click: function () { whatsapp('Réponds au quiz de ' + myName() + ' sur Lisolo', url); } } }, ic('send'), 'Envoyer sur WhatsApp'),
          h('button', { class: 'btn ghost block', type: 'button', on: { click: function () { closeOv(); go('quiz'); } } }, 'Voir mes quiz'))]);
        loadMe(true).catch(function () {});
      } catch (e) {
        pubBtn.classList.remove('loading');
        if (e.code === 'quiz_limit' || e.code === 'questions_limit') { upgradeSheet(explain(e)); return; }
        toast(explain(e), 'err');
      }
    });

    add(ov, [
      h('div', { class: 'ov-h' },
        h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Fermer', on: { click: closeOv } }, ic('back')),
        h('b', { text: 'Nouveau quiz' })),
      body, foot
    ]);
    $('#ovRoot').appendChild(ov);
    document.body.classList.add('lock');
    requestAnimationFrame(function () { ov.classList.add('open'); });
  }

  function row(icon, label, fn, danger, href) {
    var tag = href ? 'a' : 'button';
    var el = h(tag, { class: 'rw' + (danger ? ' danger' : ''), type: href ? null : 'button', href: href || null },
      ic(icon), h('span', { text: label }), ic('chev', 'chv'));
    if (fn) el.addEventListener('click', fn);
    return el;
  }

  function editNameSheet(after) {
    openSheet(function (card, close) {
      var inp = h('input', { class: 'inp', type: 'text', maxlength: '40', value: S.me.displayName, autocomplete: 'name', id: 'ednm' });
      var btn = h('button', { class: 'btn pri block', type: 'button' }, 'Enregistrer');
      btn.addEventListener('click', async function () {
        var v = inp.value.trim().replace(/\s+/g, ' ');
        if (v.length < 2 || v.length > 40) { toast(ERR.display_name_invalid, 'err'); return; }
        btn.classList.add('loading');
        try {
          await api('/api/me', { method: 'PATCH', body: { displayName: v } });
          S.me.displayName = v;
          close();
          toast('Nom affiché mis à jour');
          if (S.tab === 'profile') render();
          if (after) setTimeout(after, 280);
        } catch (e) { btn.classList.remove('loading'); toast(explain(e), 'err'); }
      });
      add(card, [
        h('h3', { text: 'Nom affiché sur mes liens' }),
        h('p', { class: 'muted', text: 'C’est le nom que tes amis voient quand ils ouvrent ton lien, par exemple Olivier. Il peut être différent du nom de ton compte Google.' }),
        h('div', null, h('label', { class: 'lbl', for: 'ednm', text: 'Nom affiché' }), inp),
        btn
      ]);
      setTimeout(function () { inp.focus(); }, 300);
    });
  }

  function editUserSheet() {
    openSheet(function (card, close) {
      var inp = h('input', { class: 'inp', type: 'text', maxlength: '20', value: S.me.username, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', id: 'edun' });
      inp.addEventListener('input', function () {
        var v = inp.value.toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '').slice(0, 20);
        if (v !== inp.value) inp.value = v;
      });
      var btn = h('button', { class: 'btn pri block', type: 'button' }, 'Enregistrer');
      btn.addEventListener('click', async function () {
        var v = inp.value.trim().toLowerCase();
        if (!PSEUDO_RE.test(v)) { toast(ERR.username_invalid, 'err'); return; }
        if (v === S.me.username) { close(); return; }
        btn.classList.add('loading');
        try {
          var d = await api('/api/me/username', { method: 'POST', body: { username: v } });
          S.me.username = d.username;
          close();
          toast('Pseudo mis à jour. Ton lien a changé.');
          if (S.tab === 'profile' || S.tab === 'home') render();
        } catch (e) { btn.classList.remove('loading'); toast(explain(e), 'err'); }
      });
      add(card, [
        h('h3', { text: 'Changer mon pseudo' }),
        h('p', { class: 'muted', text: 'Ton lien de messages utilise ce pseudo. Tu pourras le modifier une fois tous les 30 jours.' }),
        h('div', null, h('label', { class: 'lbl', for: 'edun', text: 'Pseudo' }), h('div', { class: 'pre-w' }, h('span', { class: 'pre', text: '@' }), inp)),
        btn
      ]);
      setTimeout(function () { inp.focus(); }, 300);
    });
  }

  function deleteSheet() {
    openSheet(function (card, close) {
      var inp = h('input', { class: 'inp', type: 'text', placeholder: 'SUPPRIMER', autocomplete: 'off', autocapitalize: 'characters' });
      var btn = h('button', { class: 'btn dang block', type: 'button', disabled: true }, 'Supprimer définitivement');
      inp.addEventListener('input', function () { btn.disabled = inp.value.trim() !== 'SUPPRIMER'; });
      btn.addEventListener('click', async function () {
        btn.classList.add('loading');
        try {
          await api('/api/me', { method: 'DELETE', body: { confirm: 'SUPPRIMER' } });
          leaving = true;
          location.replace('/');
        } catch (e) { btn.classList.remove('loading'); toast(explain(e), 'err'); }
      });
      add(card, [
        h('h3', { text: 'Supprimer mon compte' }),
        h('p', { class: 'muted', text: 'Tous tes messages, quiz et données seront supprimés définitivement. Tape SUPPRIMER pour confirmer.' }),
        inp, btn,
        h('button', { class: 'btn ghost block', type: 'button', on: { click: close } }, 'Annuler')
      ]);
    });
  }

  function renderProfile(view) {
    var me = S.me;
    var head = h('div', { class: 'prof' },
      avatar(me, 'lg'),
      h('h2', { text: me.displayName }),
      h('span', { class: 'muted', text: '@' + me.username }),
      me.age ? h('span', { class: 'muted', text: me.age + ' ans' }) : null,
      me.plan === 'premium'
        ? h('span', { class: 'chip pro' }, ic('star'), 'Premium')
        : h('span', { class: 'chip' }, 'Offre gratuite'));
    function linkCardFor(kind) {
      var cfg = SHARE_LINKS[kind];
      var url = origin + cfg.path();
      var copy = h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Copier le lien' }, ic('copy'));
      copy.addEventListener('click', function () { copyLink(url); });
      var share = h('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Partager le lien' }, ic('share'));
      share.addEventListener('click', function () { linkSheet(kind); });
      return h('div', { class: 'card' },
        h('div', { class: 'h3', text: cfg.label }),
        h('div', { class: 'linkline', style: 'margin-top:10px' },
          h('span', { class: 'lt', text: location.host + cfg.path() }),
          copy, share));
    }
    var planRow = me.plan === 'premium' ? null : row('star', 'Passer au Premium', function () { upgradeSheet(''); });
    var rows = h('div', { class: 'rows' },
      planRow,
      row('edit', 'Nom affiché sur mes liens', editNameSheet),
      row('user', 'Changer mon pseudo', editUserSheet),
      S.installEvt ? row('download', 'Installer l’application', async function () {
        var ev = S.installEvt;
        if (!ev) return;
        ev.prompt();
        try { await ev.userChoice; } catch (e) {}
        S.installEvt = null;
        render();
      }) : null,
      me.isAdmin ? row('shield', 'Tableau de bord admin', null, false, '/admin') : null,
      row('doc', 'Conditions d’utilisation', null, false, '/legal'),
      row('logout', 'Se déconnecter', async function () {
        try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch (e) {}
        leaving = true;
        location.replace('/login');
      }),
      row('trash', 'Supprimer mon compte', deleteSheet, true));
    add(view, [head, linkCardFor('msg'), linkCardFor('app'), rows]);
  }

  var TABS = {
    home: ['Accueil', renderHome],
    quiz: ['Mes quiz', renderQuiz],
    messages: ['Messages', renderMessages],
    profile: ['Profil', renderProfile]
  };

  function go(tab) {
    if (location.hash.slice(1) === tab) render();
    else location.hash = tab;
  }

  function render() {
    var tab = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
    S.tab = tab;
    var token = ++renderToken;
    function stale() { return token !== renderToken; }
    $$('.ni[data-tab]').forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.classList.toggle('on', on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
    placeInd();
    var view = $('#view');
    var bar = $('#barR');
    view.textContent = '';
    bar.textContent = '';
    $('#barT').textContent = TABS[tab][0];
    document.title = TABS[tab][0] + ' – Lisolo';
    view.classList.remove('enter');
    void view.offsetWidth;
    view.classList.add('enter');
    window.scrollTo(0, 0);
    TABS[tab][1](view, bar, stale);
    Array.prototype.forEach.call(view.children, function (c, i) { c.style.setProperty('--i', Math.min(i, 8)); });
  }

  function hideBoot() {
    var b = $('#boot');
    b.classList.add('off');
    setTimeout(function () { b.remove(); }, 500);
  }

  function pubShell() {
    mode = 'pub';
    document.body.className = 'm-pub';
    var root = $('#pub');
    root.hidden = false;
    root.textContent = '';
    var cta = h('a', { class: 'btn wh sm', href: '/login#signup' }, 'Créer mon lien');
    var header = h('header', { class: 'ph' },
      h('a', { class: 'pbrand', href: '/', 'aria-label': 'Lisolo, accueil' }, h('span', { class: 'logo-s', 'aria-hidden': 'true' }), 'Lisolo'),
      cta);
    var content = h('main', { class: 'pc' });
    root.appendChild(header);
    root.appendChild(content);
    hideBoot();
    return content;
  }

  function pubError(content, text) {
    content.textContent = '';
    content.appendChild(h('div', { class: 'pcard' },
      h('h2', { text: 'Oups' }),
      h('p', { class: 'muted', text: text }),
      h('a', { class: 'btn pri block', href: '/' }, 'Découvrir Lisolo')));
  }

  async function pubProfile(username) {
    var content = pubShell();
    var p;
    try { p = await api('/api/public/u/' + username, { auth: false }); }
    catch (e) { pubError(content, e.status === 404 ? 'Ce profil est introuvable.' : explain(e)); return; }
    document.title = 'Message anonyme pour ' + p.displayName + ' – Lisolo';
    var ta = h('textarea', { class: 'ta', maxlength: '500', placeholder: 'Écris ton message ici…', rows: '5', 'aria-label': 'Ton message anonyme' });
    var hp = h('input', { class: 'hp', type: 'text', name: 'hp_x', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true' });
    var cnt = h('div', { class: 'cnt', text: '0 / 500' });
    var errBox = h('div', { class: 'err-t', hidden: true, role: 'alert' });
    var send = h('button', { class: 'btn pri block', type: 'button' }, ic('send'), 'Envoyer anonymement');
    var card = h('div', { class: 'pcard' });
    ta.addEventListener('input', function () { cnt.textContent = ta.value.length + ' / 500'; errBox.hidden = true; });

    function form() {
      card.textContent = '';
      ta.value = '';
      cnt.textContent = '0 / 500';
      add(card, [
        h('h2', { text: 'Envoie un message anonyme' }),
        h('p', { class: 'muted', text: p.displayName + ' ne saura pas que c’est toi. Sois sincère et bienveillant.' }),
        ta, hp, cnt, errBox, send,
        h('p', { class: 'muted', style: 'font-size:13px;text-align:center', text: 'Pas de compte nécessaire.' })
      ]);
    }
    function sent() {
      card.textContent = '';
      var again = h('button', { class: 'btn ghost block', type: 'button', disabled: true }, 'Envoyer un autre message');
      add(card, [h('div', { class: 'sent' },
        bigCheck(),
        h('h2', { text: 'Message envoyé' }),
        h('p', { class: 'muted', text: 'Ton message est parti en toute discrétion.' }),
        h('div', { class: 'cta2', style: 'width:100%' },
          h('a', { class: 'btn pri block', href: '/login#signup' }, 'Créer mon propre lien Lisolo'),
          again))]);
      setTimeout(function () {
        again.disabled = false;
        again.addEventListener('click', form);
      }, 5000);
    }
    send.addEventListener('click', async function () {
      var t = ta.value.trim();
      if (t.length < 2) { errBox.textContent = ERR.message_invalid; errBox.hidden = false; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); return; }
      send.classList.add('loading');
      try {
        await api('/api/public/u/' + username + '/messages', { method: 'POST', auth: false, body: { text: t, hp: hp.value } });
        sent();
      } catch (e) {
        send.classList.remove('loading');
        errBox.textContent = explain(e);
        errBox.hidden = false;
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    });

    content.appendChild(h('section', { class: 'phero' }, avatar(p), h('h1', { text: p.displayName }), h('p', { text: 'Reçoit des messages anonymes sur Lisolo' })));
    content.appendChild(card);
    form();
  }

  async function pubQuiz(id) {
    var content = pubShell();
    var z;
    try { z = await api('/api/public/quizzes/' + id, { auth: false }); }
    catch (e) { pubError(content, e.status === 404 ? 'Ce quiz est introuvable ou n’est plus actif.' : explain(e)); return; }
    document.title = 'Quiz : ' + z.title + ' – Lisolo';
    var n = z.questions.length;
    var card = h('div', { class: 'pcard' });
    var answers = [];
    var qi = 0;
    var nick = '';
    var saved = '';
    try { saved = localStorage.getItem('lisolo_nick') || ''; } catch (e) {}

    function intro() {
      card.textContent = '';
      answers = []; qi = 0;
      var input = h('input', { class: 'inp', type: 'text', maxlength: '24', placeholder: 'Ton prénom ou pseudo', autocomplete: 'nickname', value: saved, 'aria-label': 'Ton prénom ou pseudo' });
      var go1 = h('button', { class: 'btn pri block', type: 'button' }, 'Commencer le quiz');
      go1.addEventListener('click', function () {
        var v = input.value.trim().replace(/\s+/g, ' ');
        if (!v || v.length > 24) { toast(ERR.nickname_invalid, 'err'); return; }
        nick = v;
        try { localStorage.setItem('lisolo_nick', v); } catch (e) {}
        question();
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go1.click(); });
      add(card, [
        h('span', { class: 'kick', text: 'Quiz de ' + z.ownerName }),
        h('h1', { class: 'pt', text: z.title }),
        h('p', { class: 'muted', text: n + ' question' + (n > 1 ? 's' : '') + '. Pas besoin de compte.' }),
        input, go1
      ]);
    }

    function question() {
      card.textContent = '';
      var q = z.questions[qi];
      var fill = h('i', { style: 'width:' + Math.round((qi / n) * 100) + '%' });
      var opts = h('div', { class: 'opts' });
      q.options.forEach(function (t, i) {
        var b = h('button', { class: 'opt', type: 'button' }, h('span', { class: 'ol', text: String.fromCharCode(65 + i) }), h('span', { text: t }));
        b.addEventListener('click', function () {
          answers[qi] = i;
          Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
          b.classList.add('sel');
          fill.style.width = Math.round(((qi + 1) / n) * 100) + '%';
          setTimeout(function () {
            qi++;
            if (qi >= n) submit(); else question();
          }, 320);
        });
        opts.appendChild(b);
      });
      add(card, [
        h('div', { class: 'prog' }, h('span', { class: 'pbar' }, fill), h('span', { class: 'pn', text: (qi + 1) + '/' + n })),
        h('h2', { class: 'qq', text: q.q }),
        opts
      ]);
    }

    async function submit() {
      card.textContent = '';
      add(card, [h('div', { class: 'sk', style: 'height:160px' }), h('p', { class: 'muted', style: 'text-align:center', text: 'Calcul de ton score…' })]);
      try {
        var r = await api('/api/public/quizzes/' + id + '/answers', { method: 'POST', auth: false, body: { nickname: nick, answers: answers, hp: '' } });
        result(r);
      } catch (e) {
        card.textContent = '';
        var retry = h('button', { class: 'btn pri block', type: 'button', on: { click: submit } }, 'Réessayer');
        add(card, [h('h2', { text: 'Envoi impossible' }), h('p', { class: 'muted', text: explain(e) }), e.code === 'quiz_full' || e.code === 'not_found' ? h('a', { class: 'btn pri block', href: '/login#signup' }, 'Créer mon propre quiz') : retry]);
      }
    }

    function result(r) {
      card.textContent = '';
      var ratio = r.total ? r.score / r.total : 0;
      var verdict = ratio === 1 ? 'Parfait ! Tu le connais par cœur.' : ratio >= 0.7 ? 'Très bien joué !' : ratio >= 0.4 ? 'Pas mal, tu peux faire mieux.' : 'Aïe, rejoue pour t’améliorer.';
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 120 120');
      svg.setAttribute('aria-hidden', 'true');
      var bg = document.createElementNS(NS, 'circle');
      bg.setAttribute('class', 'bg'); bg.setAttribute('cx', '60'); bg.setAttribute('cy', '60'); bg.setAttribute('r', '54');
      var fgc = document.createElementNS(NS, 'circle');
      fgc.setAttribute('class', 'fg'); fgc.setAttribute('cx', '60'); fgc.setAttribute('cy', '60'); fgc.setAttribute('r', '54');
      svg.appendChild(bg); svg.appendChild(fgc);
      var rev = h('div', { class: 'rev' });
      z.questions.forEach(function (q, i) {
        var good = answers[i] === r.correct[i];
        rev.appendChild(h('div', { class: 'rv' },
          h('span', { class: 'ri' + (good ? '' : ' bad') }, ic(good ? 'check' : 'x')),
          h('div', null, h('b', { text: q.q }),
            h('span', { text: 'Ta réponse : ' + q.options[answers[i]] }),
            good ? null : h('span', { text: 'Bonne réponse : ' + q.options[r.correct[i]] }))));
      });
      var again = h('button', { class: 'btn ghost block', type: 'button', on: { click: intro } }, 'Rejouer');
      add(card, [
        h('div', { class: 'score' }, svg, h('b', { text: r.score + '/' + r.total })),
        h('h2', { text: verdict, style: 'text-align:center' }),
        rev,
        h('div', { class: 'cta2' },
          h('a', { class: 'btn pri block', href: '/login#signup' }, 'Créer mon propre quiz'),
          again)
      ]);
      requestAnimationFrame(function () { requestAnimationFrame(function () { fgc.style.strokeDashoffset = String(339.3 * (1 - ratio)); }); });
    }

    content.appendChild(card);
    intro();
  }

  async function appMode() {
    mode = 'app';
    try {
      await loadMe(true);
    } catch (e) {
      if (leaving) return;
      document.body.className = 'm-pub';
      var root = $('#pub');
      root.hidden = false;
      root.appendChild(h('main', { class: 'pc' }, h('div', { class: 'pcard' },
        h('h2', { text: 'Connexion impossible' }),
        h('p', { class: 'muted', text: explain(e) }),
        h('button', { class: 'btn pri block', type: 'button', on: { click: function () { location.reload(); } } }, 'Réessayer'))));
      hideBoot();
      return;
    }
    document.body.className = 'm-app';
    $('#shell').hidden = false;
    $$('.ni[data-tab]').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.tab); }); });
    $('#createBtn').addEventListener('click', createSheet);
    window.addEventListener('hashchange', render);
    window.addEventListener('resize', placeInd);
    window.addEventListener('appinstalled', function () { S.installEvt = null; });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - S.meTs > 60000) loadMe(true).catch(function () {});
    });
    render();
    logoImage().catch(function () {});
    hideBoot();
  }

  function boot() {
    var m = location.pathname.match(/^\/u\/([a-z0-9_]{3,20})\/?$/);
    if (m) { pubProfile(m[1]); return; }
    m = location.pathname.match(/^\/q\/([A-Za-z0-9]{20})\/?$/);
    if (m) { pubQuiz(m[1]); return; }
    appMode();
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    S.installEvt = e;
    if (mode === 'app' && S.tab === 'profile') render();
  });
  boot();
  window.addEventListener('load', function () {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
})();
</script>
</body>
</html>
